name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # ручной запуск из интерфейса GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate card SVGs
        run: node scripts/generate-cards.mjs

      - name: Build
        run: vue-tsc -b && vite build
        env:
          GITHUB_PAGES: 'true'
          VITE_PUBLIC_URL: 'https://helena6421.github.io/moscowcss-horoscope'

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
