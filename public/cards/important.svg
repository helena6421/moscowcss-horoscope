<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1080 1680">

  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg_important" x1="0" y1="0" x2="1080" y2="1680"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>

    <!-- Halftone dots pattern -->
    <pattern id="dots_important" x="0" y="0" width="26" height="26"
             patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="2" fill="rgba(255,255,255,0.07)"/>
    </pattern>

    <!-- Character drop-shadow filter -->
    <filter id="char_shadow_important" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="5" dy="8" stdDeviation="12"
                    flood-color="rgba(0,0,0,0.40)"/>
    </filter>
  </defs>

  <!-- ① Background -->
  <rect width="1080" height="1680" fill="url(#bg_important)"/>
  <rect width="1080" height="1680" fill="url(#dots_important)"/>

  <!-- ② Outer comic border -->
  <rect x="16" y="16" width="1048" height="1648" rx="36"
        fill="none" stroke="#1F1F1F" stroke-width="10"/>
  <!-- Inner highlight ring -->
  <rect x="28" y="28" width="1024" height="1624" rx="28"
        fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2.5"/>

  <!-- ③ Character illustration -->
  <g filter="url(#char_shadow_important)">
    <svg x="260" y="52"
         width="560" height="560"
         viewBox="0 0 400 400" overflow="visible">
      
  <!-- Background circle -->
  <circle cx="200" cy="200" r="192" fill="#FFF1F2" stroke="#1F1F1F" stroke-width="6"/>

  <!-- Action burst / explosion lines -->
  <line x1="200" y1="200" x2="200" y2="20" stroke="#EF4444" stroke-width="3" opacity="0.4"/>
  <line x1="200" y1="200" x2="20" y2="200" stroke="#FB923C" stroke-width="3" opacity="0.3"/>
  <line x1="200" y1="200" x2="380" y2="200" stroke="#FB923C" stroke-width="3" opacity="0.3"/>
  <line x1="200" y1="200" x2="60" y2="60" stroke="#EF4444" stroke-width="2.5" opacity="0.3"/>
  <line x1="200" y1="200" x2="340" y2="60" stroke="#EF4444" stroke-width="2.5" opacity="0.3"/>
  <line x1="200" y1="200" x2="60" y2="340" stroke="#FB923C" stroke-width="2" opacity="0.25"/>
  <line x1="200" y1="200" x2="340" y2="340" stroke="#FB923C" stroke-width="2" opacity="0.25"/>

  <!-- Giant "!" symbol (background) -->
  <text x="268" y="285" font-size="200" font-family="Impact, Arial Black, sans-serif" font-weight="900"
        fill="#EF4444" stroke="#1F1F1F" stroke-width="5" opacity="0.18">!</text>

  <!-- Fist (raised right arm) -->
  <circle cx="308" cy="120" r="28" fill="#EF4444" stroke="#1F1F1F" stroke-width="5"/>
  <!-- Fist knuckles -->
  <path d="M 285 108 Q 308 98 330 108" stroke="#1F1F1F" stroke-width="2.5" fill="none"/>
  <circle cx="293" cy="106" r="4" fill="#1F1F1F" opacity="0.4"/>
  <circle cx="308" cy="102" r="4" fill="#1F1F1F" opacity="0.4"/>
  <circle cx="322" cy="106" r="4" fill="#1F1F1F" opacity="0.4"/>

  <!-- Body (stocky, powerful) -->
  <rect x="148" y="235" width="108" height="95" rx="18" fill="#EF4444" stroke="#1F1F1F" stroke-width="5"/>
  <!-- "!" on chest -->
  <text x="200" y="302" font-size="48" font-family="Impact, sans-serif" fill="white" stroke="#1F1F1F" stroke-width="2" text-anchor="middle" font-weight="900">!</text>

  <!-- Right arm (raised with fist) -->
  <path d="M 254 255 Q 285 205 308 148" stroke="#EF4444" stroke-width="16" stroke-linecap="round" fill="none"/>

  <!-- Left arm (akimbo) -->
  <path d="M 150 260 Q 112 270 88 258" stroke="#EF4444" stroke-width="16" stroke-linecap="round" fill="none"/>
  <circle cx="84" cy="256" r="16" fill="#EF4444" stroke="#1F1F1F" stroke-width="4"/>

  <!-- Legs (wide stance) -->
  <path d="M 168 328 Q 152 355 140 378" stroke="#EF4444" stroke-width="15" stroke-linecap="round" fill="none"/>
  <path d="M 236 328 Q 252 355 265 378" stroke="#EF4444" stroke-width="15" stroke-linecap="round" fill="none"/>
  <ellipse cx="137" cy="381" rx="20" ry="10" fill="#1F1F1F"/>
  <ellipse cx="268" cy="381" rx="20" ry="10" fill="#1F1F1F"/>

  <!-- Head -->
  <circle cx="200" cy="188" r="52" fill="#FB923C" stroke="#1F1F1F" stroke-width="5"/>

  <!-- Eyes (intense / determined) -->
  <circle cx="182" cy="182" r="11" fill="white" stroke="#1F1F1F" stroke-width="3"/>
  <circle cx="218" cy="182" r="11" fill="white" stroke="#1F1F1F" stroke-width="3"/>
  <circle cx="185" cy="184" r="6" fill="#1F1F1F"/>
  <circle cx="221" cy="184" r="6" fill="#1F1F1F"/>
  <circle cx="187" cy="181" r="2" fill="white"/>
  <circle cx="223" cy="181" r="2" fill="white"/>

  <!-- Angry/determined eyebrows (slanted inward) -->
  <path d="M 172 168 Q 183 161 194 167" stroke="#1F1F1F" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 207 167 Q 217 161 228 168" stroke="#1F1F1F" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Grin (wide, confident) -->
  <path d="M 180 203 Q 200 220 220 203" stroke="#1F1F1F" stroke-width="4" fill="white" stroke-linecap="round"/>

  <!-- Speech bubble with !important -->
  <rect x="30" y="50" width="150" height="52" rx="14" fill="white" stroke="#1F1F1F" stroke-width="3.5"/>
  <path d="M 80 100 L 95 122 L 65 105" fill="white" stroke="#1F1F1F" stroke-width="2.5"/>
  <text x="105" y="73" font-size="13" font-family="monospace" font-weight="bold" fill="#EF4444" text-anchor="middle">color: red</text>
  <text x="105" y="91" font-size="13" font-family="monospace" font-weight="bold" fill="#EF4444" text-anchor="middle">!important;</text>

    </svg>
  </g>

  <!-- ④ CSS property pill -->
  <rect x="56" y="644" width="968" height="100" rx="22"
        fill="#1F1F1F"/>
  <rect x="59" y="647" width="962" height="94" rx="19"
        fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <text x="540" y="713.24"
        text-anchor="middle"
        font-family="'Courier New',Courier,monospace"
        font-size="52" font-weight="bold"
        fill="#FFFFFF" letter-spacing="1">!important</text>

  <!-- ⑤ Name -->
  <text x="540" y="864"
        text-anchor="middle"
        font-family="'Arial Black','Arial Bold',Arial,sans-serif"
        font-size="72" font-weight="900"
        stroke="#1F1F1F" stroke-width="6" stroke-linejoin="round"
        paint-order="stroke fill"
        fill="#FFFFFF">«Последний аргумент»</text>

  <!-- ⑥ Description -->
  <text x="540" y="920"
        text-anchor="middle"
        font-family="Arial,Helvetica,sans-serif"
        font-size="44" line-height="66"
        fill="rgba(255,255,255,0.95)">
    <tspan x="540" dy="0">Когда спор затягивается, ты достаёшь</tspan>
      <tspan x="540" dy="66">аргумент с восклицательным знаком. Задача</tspan>
      <tspan x="540" dy="66">закрыта. Кто будет переопределять это</tspan>
      <tspan x="540" dy="66">завтра — вопрос завтрашнего тебя.</tspan>
  </text>

  <!-- ⑦ Superpower badge -->
  <rect x="56" y="1240" width="968" height="196" rx="24"
        fill="rgba(255,255,255,0.17)"
        stroke="rgba(255,255,255,0.38)" stroke-width="2.5"/>
  <!-- label -->
  <text x="540" y="1292"
        text-anchor="middle"
        font-family="Arial,Helvetica,sans-serif"
        font-size="26" font-weight="900" letter-spacing="5"
        fill="rgba(255,255,255,0.68)">СУПЕРСИЛА</text>
  <!-- superpower text -->
  <text x="540" y="1336"
        text-anchor="middle"
        font-family="Arial,Helvetica,sans-serif"
        font-size="34" font-weight="700"
        fill="#FFFFFF">
    <tspan x="540" dy="0">Менять расклад сил в каскаде одним заявлением.</tspan>
  </text>

  <!-- ⑧ Footer bar -->
  <rect x="0" y="1492" width="1080" height="188"
        fill="rgba(0,0,0,0.30)"/>
  <!-- Divider line -->
  <line x1="112" y1="1494" x2="968" y2="1494"
        stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
  <text x="540" y="1602"
        text-anchor="middle"
        font-family="Arial,Helvetica,sans-serif"
        font-size="32" font-weight="700" letter-spacing="5"
        fill="rgba(255,255,255,0.80)">MoscowCSS  ·  #MoscowCSS</text>
</svg>